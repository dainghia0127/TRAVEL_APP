<!DOCTYPE html>
<html lang="vi">
<head>
  <!--
    Base href will be replaced by Flutter CLI during build with --base-href
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TRAVEL APP — Ứng dụng dã ngoại, phượt, lập lịch trình và sinh tồn ngoài trời chuyên nghiệp.">

  <!-- Viewport config for iPhone Dynamic Island & Notch edge-to-edge -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS PWA Meta Tags & Icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TRAVEL APP">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Android & Web Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0B1510">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TRAVEL APP — Dã Ngoại & Sinh Tồn</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      background-color: #0B1510;
      color: #E6E8EA;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #splash-loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #0B1510;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }
    .splash-logo {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      margin-bottom: 20px;
    }
    .splash-title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #E2BA62;
      margin-bottom: 6px;
    }
    .splash-subtitle {
      font-size: 12px;
      color: #8C9993;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <!-- Native-like dark splash screen during Flutter engine bootstrap -->
  <div id="splash-loading">
    <img class="splash-logo" src="icons/Icon-192.png" alt="TRAVEL APP" />
    <div class="splash-title">TRAVEL APP</div>
    <div class="splash-subtitle">Dã Ngoại & Sinh Tồn Ngoài Trời</div>
  </div>

  <script>
    window.addEventListener('load', function() {
      // Tự động làm mờ và ẩn splash loader khi Flutter engine đã sẵn sàng
      var checkFlutter = setInterval(function() {
        if (window._flutter && window._flutter.loader) {
          var splash = document.getElementById('splash-loading');
          if (splash) {
            setTimeout(function() {
              splash.style.opacity = '0';
              setTimeout(function() {
                if (splash.parentNode) splash.parentNode.removeChild(splash);
              }, 400);
            }, 300);
          }
          clearInterval(checkFlutter);
        }
      }, 100);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
