<!DOCTYPE html>
<html lang="vi">
<head>
  <!--
    Base href will be replaced by Flutter CLI during build with --base-href
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TRAVEL APP — Ứng dụng dã ngoại, phượt, lập lịch trình và sinh tồn ngoài trời chuyên nghiệp.">

  <!-- Viewport config for iPhone Dynamic Island & Notch edge-to-edge -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- Modern PWA Meta Tags & Icons (Use standard manifest and modern iOS Web App engine) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TRAVEL APP">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Android & Web Meta Tags -->
  <meta name="theme-color" content="#0B1510">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TRAVEL APP — Dã Ngoại & Sinh Tồn</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      background-color: #0B1510;
      color: #E6E8EA;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Chuyển giao toàn bộ touch/pointer events trực tiếp cho Flutter Web engine không bị WebKit delay */
    flutter-view, flt-glass-pane {
      touch-action: none !important;
      -webkit-user-select: none !important;
      user-select: none !important;
    }

    #splash-loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #0B1510;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease-out;
      pointer-events: none;
    }
    .splash-logo {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      margin-bottom: 20px;
    }
    .splash-title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #E2BA62;
      margin-bottom: 6px;
    }
    .splash-subtitle {
      font-size: 12px;
      color: #8C9993;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <!-- Native-like dark splash screen during Flutter engine bootstrap -->
  <div id="splash-loading">
    <img class="splash-logo" src="icons/Icon-192.png" alt="TRAVEL APP" />
    <div class="splash-title">TRAVEL APP</div>
    <div class="splash-subtitle">Dã Ngoại & Sinh Tồn Ngoài Trời</div>
  </div>

  <script>
    // iOS Standalone PWA Touch & Viewport Fix
    (function() {
      // 1. Kích hoạt WebKit touch engine trên iOS Safari PWA
      document.addEventListener('touchstart', function() {}, { passive: true });

      // 2. Đánh thức Flutter view scheduler khi người dùng chuyển đổi app hoặc mở lại
      document.addEventListener('visibilitychange', function() {
        if (!document.hidden) {
          window.dispatchEvent(new Event('resize'));
        }
      });

      // 3. Tự động gỡ bỏ Splash Screen mượt mà và an toàn
      function dismissSplash() {
        var splash = document.getElementById('splash-loading');
        if (splash && splash.parentNode) {
          splash.style.opacity = '0';
          setTimeout(function() {
            if (splash.parentNode) splash.parentNode.removeChild(splash);
          }, 300);
        }
      }

      window.addEventListener('flutter-first-frame', dismissSplash);
      window.addEventListener('load', function() {
        setTimeout(dismissSplash, 1500);
      });
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
