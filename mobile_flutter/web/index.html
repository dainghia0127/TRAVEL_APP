<!DOCTYPE html>
<html lang="vi">
<head>
  <!--
    Base href will be replaced by Flutter CLI during build with --base-href
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TRAVEL APP — Ứng dụng dã ngoại, phượt, lập lịch trình và sinh tồn ngoài trời chuyên nghiệp.">

  <!-- Viewport config for iPhone Dynamic Island & Notch edge-to-edge -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS PWA Meta Tags & Icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TRAVEL APP">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Android & Web Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0B1510">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TRAVEL APP — Dã Ngoại & Sinh Tồn</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: auto;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      background-color: #0B1510;
      color: #E6E8EA;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Đảm bảo Flutter Glass Pane trải rộng toàn màn hình và nhận trọn vẹn sự kiện chạm */
    flt-glass-pane {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      touch-action: manipulation !important;
      overscroll-behavior: none !important;
    }

    #splash-loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #0B1510;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.35s ease-out;
      pointer-events: auto;
    }
    .splash-logo {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      margin-bottom: 20px;
    }
    .splash-title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #E2BA62;
      margin-bottom: 6px;
    }
    .splash-subtitle {
      font-size: 12px;
      color: #8C9993;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <!-- Native-like dark splash screen during Flutter engine bootstrap -->
  <div id="splash-loading">
    <img class="splash-logo" src="icons/Icon-192.png" alt="TRAVEL APP" />
    <div class="splash-title">TRAVEL APP</div>
    <div class="splash-subtitle">Dã Ngoại & Sinh Tồn Ngoài Trời</div>
  </div>

  <script>
    // iOS Standalone PWA Touch-Fix: Chặn triệt để hiện tượng overscroll bounce của WebKit
    // làm hủy bỏ (touchcancel) sự kiện chạm vào các nút của Flutter
    (function() {
      var isIosStandalone = window.navigator.standalone === true || 
                            window.matchMedia('(display-mode: standalone)').matches;

      // Chặn rubber-banding nảy trang trên iOS WebClip PWA
      document.addEventListener('touchmove', function(e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) {
          return; // Cho phép cuộn và chọn văn bản trong ô nhập liệu
        }
        // Cho phép Flutter Glass Pane tự quản lý cuộn bên trong canvas mà không bị trình duyệt can thiệp
      }, { passive: true });

      // Tự động gỡ bỏ Splash Screen mượt mà và an toàn
      var hasDismissedSplash = false;
      function dismissSplash() {
        if (hasDismissedSplash) return;
        hasDismissedSplash = true;
        var splash = document.getElementById('splash-loading');
        if (splash) {
          splash.style.pointerEvents = 'none'; // Giải phóng click ngay lập tức
          splash.style.opacity = '0';
          setTimeout(function() {
            if (splash.parentNode) splash.parentNode.removeChild(splash);
          }, 350);
        }
      }

      // Lắng nghe khi Flutter engine nạp xong frame đầu tiên
      window.addEventListener('flutter-first-frame', dismissSplash);

      // Dự phòng: Nếu flutter-first-frame không kích hoạt, gỡ bỏ sau khi trang load
      window.addEventListener('load', function() {
        var checkFlutter = setInterval(function() {
          if (window._flutter && (window._flutter.loader || window._flutter.buildConfig)) {
            setTimeout(dismissSplash, 300);
            clearInterval(checkFlutter);
          }
        }, 100);

        // Giới hạn tối đa 2.2 giây luôn luôn ẩn splash để không bao giờ bị kẹt
        setTimeout(dismissSplash, 2200);
      });
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
