name: Auto Enrich Trekking Destinations

on:
  schedule:
    # Tự động chạy định kỳ vào 00:00 mỗi ngày (17:00 UTC = 00:00 GMT+7 Giờ Việt Nam)
    - cron: '0 17 * * *'
    # Mốc dự phòng 00:00 UTC hàng ngày
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Số lượng địa danh trekking mới muốn bổ sung tự động'
        required: true
        default: '2'

concurrency:
  group: auto-sync-destinations
  cancel-in-progress: true

jobs:
  auto-update:
    name: Auto Enrich Seed Destinations
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Auto Destinations Updater
        run: |
          COUNT="${{ github.event.inputs.count || '2' }}"
          python tools/auto_destinations_updater.py --count "$COUNT"

      - name: Commit & Push if New Destinations Added
        run: |
          git diff --quiet mobile_flutter/assets/data/destinations_seed.json && echo "No changes detected" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile_flutter/assets/data/destinations_seed.json
          git commit -m "chore(destinations): auto-enrich new trekking spots from outdoor cloud pool [skip ci]"
          git push origin main

