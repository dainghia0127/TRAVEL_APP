name: Build iOS IPA
run-name: "Build iOS IPA - ${{ github.ref_name }} (Run #${{ github.run_number }})"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Mã phiên bản hiển thị (VD: ver1.1)'
        required: true
        default: 'ver1.1'

# Tự động hủy (cancel) các lượt build cũ bị treo hoặc xếp hàng dở dang khi có commit mới
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build Native iOS IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Dynamic Version & Date Tag
        id: meta
        run: |
          BUILD_DATE=$(date +"%d.%m.%Y")
          VER="${{ inputs.version_name || 'ver1.1' }}"
          TAG_NAME="${BUILD_DATE}_APP_TRAVEL_${VER}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "=== ARTIFACT TAG: ${TAG_NAME} ==="

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & CocoaPods
        run: |
          flutter --version
          pod --version

      - name: Install Flutter Dependencies
        run: |
          cd mobile_flutter
          flutter pub get

      - name: Build iOS Application (Release)
        run: |
          cd mobile_flutter
          flutter build ios --release --no-codesign

      - name: Package Payload into .ipa
        run: |
          cd mobile_flutter
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -q TravelOutdoorApp.ipa Payload
          echo "=== IPA PACKAGE CREATED ==="
          ls -lh TravelOutdoorApp.ipa

      - name: Upload IPA Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.tag_name }}
          path: mobile_flutter/TravelOutdoorApp.ipa
          retention-days: 14
