name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'mobile_flutter/**'
      - '.github/workflows/deploy_pwa_pages.yml'
  workflow_dispatch:

# Cấp quyền hạn chuẩn xác để GitHub Pages deploy an toàn
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd mobile_flutter
          flutter pub get

      - name: Build Flutter Web (PWA Edge-to-Edge)
        run: |
          cd mobile_flutter
          # Tự động gán base-href ứng với tên repo GitHub (mặc định /TRAVEL_APP/)
          REPO_NAME="${{ github.event.repository.name }}"
          flutter build web --release --base-href "/${REPO_NAME}/"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile_flutter/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

