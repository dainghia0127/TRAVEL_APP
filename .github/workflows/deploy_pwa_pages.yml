name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'mobile_flutter/**'
      - '.github/workflows/deploy_pwa_pages.yml'
  workflow_dispatch:

# Cấp quyền hạn chuẩn xác để GitHub Pages deploy an toàn & dọn dẹp run cũ
permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cleanup Previous Workflow Runs (Xóa bản cũ)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Dang kiem tra va xoa cac ban chay cu cua workflow deploy_pwa_pages.yml..."
          RUN_IDS=$(gh run list --workflow "deploy_pwa_pages.yml" --limit 30 --json databaseId --jq ".[] | select(.databaseId != ${{ github.run_id }}) | .databaseId" || true)
          for id in $RUN_IDS; do
            echo "Xoa workflow run cu: $id"
            gh run delete "$id" || true
          done
          echo "Hoan tat don dep ban cu cho deploy_pwa_pages.yml!"
        continue-on-error: true

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd mobile_flutter
          flutter pub get

      - name: Build Flutter Web (PWA Edge-to-Edge)
        run: |
          cd mobile_flutter
          # Tự động gán base-href ứng với tên repo GitHub (mặc định /TRAVEL_APP/)
          # Tối ưu hóa -O4 và loại bỏ source maps để ứng dụng nhẹ nhất, mượt nhất trên Safari iPhone
          REPO_NAME="${{ github.event.repository.name }}"
          flutter build web --release --base-href "/${REPO_NAME}/" -O4 --no-source-maps

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile_flutter/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

